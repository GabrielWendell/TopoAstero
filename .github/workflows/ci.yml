name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --group dev
      - name: Check repository portability
        run: uv run topoastero check-portability --root .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest
      - name: Reproduce smoke workflow
        run: |
          uv run topoastero smoke --config configs/smoke.yaml --output-dir "$RUNNER_TEMP/topoastero-smoke"
          uv run python workflows/compare_smoke_reference.py results/smoke "$RUNNER_TEMP/topoastero-smoke" --abs-tol 1e-12
      - name: Validate Stage 0 contract
        run: uv run topoastero validate-stage0 --root .
      - name: Validate Stage 1 contract
        run: uv run topoastero validate-stage1 --root .
      - name: Validate Stage 2 contract
        run: uv run topoastero validate-stage2 --root .
      - name: Validate Stage 3 contract
        run: uv run topoastero validate-stage3 --root .
      - name: Validate Stage 4 contract
        run: uv run topoastero validate-stage4 --root .
      - name: Validate Stage 5 contract
        run: uv run topoastero validate-stage5 --root .
      - name: Validate Stage 6 contract
        run: uv run topoastero validate-stage6 --root .
      - name: Build distribution
        run: uv build --out-dir "$RUNNER_TEMP/dist"
