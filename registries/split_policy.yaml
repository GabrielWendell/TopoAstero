algorithm:
  name: deterministic_grouped_stratified_assignment
  master_seed: 20260721
  order_rule: Sort by canonical stable star ID before any seeded operation.
  stratification_candidates: [evolutionary_state, nu_max_bin, signal_to_noise_bin, duty_cycle_bin]
