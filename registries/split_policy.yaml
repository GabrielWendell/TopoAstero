schema_version: 2
policy_id: TA-SPLIT-2.0
frozen_on: 2026-09-20
assignment_status: frozen_T2.8
group_key: stable_star_id
rudy_role: descriptive_benchmark_only
target_fractions:
  development: 0.60
  internal_validation: 0.20
  final_holdout: 0.20
algorithm:
  name: TA-GROUPED-STRATIFIED-SHA256-v1
  master_seed: 20260721
  order_rule: Sort by canonical stable star ID before any seeded operation.
  primary_stratification: nu_max rank tertile among the 65 non-Rudy LEGACY stars
  balance_diagnostic: effective-temperature rank tertile
  stratification_freeze: >-
    The source variables were frozen from Stage 1 reference metadata before computing any
    topological representation. Signal-to-noise and duty cycle were not used because population
    payloads remain inventory-only candidates at G2.
constraints:
  - Every star appears in exactly one role.
  - Every observation, mission segment, and derived representation of a star inherits its role.
  - A TESS observation cannot validate a method tuned on the same star's Kepler observation.
  - Exclusions are determined before topology and retained in the exclusion ledger.
protection:
  identities_visible_before_opening: true_in_portable_source_snapshot
  identity_confidentiality: >-
    Not claimed: the public-data repository has no independent secret store. Protection is by
    immutable grouping, content sealing, an unopened analysis state, and access logging.
  publish_assignment_hash: true
  one_time_access: true
  authorization_roles: [supervisor, data_steward]
  access_log: registries/holdout_access_log.csv
actual_assignments: registries/population_partitions.csv
attestation: registries/split_attestation.json
balance_report: reports/stage2/partition_balance.json
